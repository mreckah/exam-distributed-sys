<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <script>
      function apiBase() {
        // Works when served directly (inventory-service) and via gateway (/inventory-service/...)
        const p = window.location.pathname || "";
        if (p.startsWith("/inventory-service/")) return "/inventory-service";
        return "";
      }

      function setStatus(message, isError) {
        const el = document.getElementById("status");
        if (!el) return;
        el.textContent = message || "";
        el.className = isError
          ? "alert alert-danger mt-2 mb-0"
          : "alert alert-info mt-2 mb-0";
        el.style.display = message ? "block" : "none";
      }

      function clearRows() {
        document.getElementById("rows").innerHTML = "";
      }

      function td(text) {
        const el = document.createElement("td");
        el.textContent = text == null ? "" : String(text);
        return el;
      }

      function addProductRow(p) {
        const tr = document.createElement("tr");
        tr.appendChild(td(p.id));
        tr.appendChild(td(p.name));
        tr.appendChild(td(p.price));
        tr.appendChild(td(p.quantity));
        tr.appendChild(td(p.status));
        tr.appendChild(td(p.category && (p.category.name || p.category.id) ? (p.category.name || p.category.id) : ""));
        document.getElementById("rows").appendChild(tr);
      }

      async function listProducts() {
        try {
          setStatus("Loading products...", false);
          const res = await fetch(`${apiBase()}/queries/inventory/products`, {
            cache: "no-store",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          clearRows();
          if (!Array.isArray(data) || data.length === 0) {
            setStatus("No products found.", false);
            return;
          }

          data.forEach(addProductRow);
          setStatus(`Loaded ${data.length} product(s).`, false);
        } catch (e) {
          setStatus(`Failed to load products: ${e.message}`, true);
        }
      }

      async function getProductById() {
        const id = (document.getElementById("productId").value || "").trim();
        if (!id) {
          setStatus("Enter a Product Id.", true);
          return;
        }

        try {
          setStatus(`Loading product ${id}...`, false);
          const res = await fetch(
            `${apiBase()}/queries/inventory/products/${encodeURIComponent(id)}`,
            { cache: "no-store" }
          );
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const p = await res.json();

          clearRows();
          if (!p) {
            setStatus(`Product ${id} not found.`, false);
            return;
          }

          addProductRow(p);
          setStatus(`Loaded product ${id}.`, false);
        } catch (e) {
          setStatus(`Failed to load product: ${e.message}`, true);
        }
      }

      window.addEventListener("load", () => {
        listProducts();
      });
    </script>
  </head>

  <body>
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h4 class="mb-0">Products</h4>
          <small class="text-muted">Inventory query UI</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" onclick="listProducts()">
            Refresh
          </button>
        </div>
      </div>

      <div class="row g-2 mt-2">
        <div class="col-md-4">
          <input
            id="productId"
            class="form-control"
            placeholder="Product Id (optional)"
          />
        </div>
        <div class="col-md-auto">
          <button class="btn btn-primary" onclick="getProductById()">
            Get by id
          </button>
        </div>
        <div class="col-md-auto">
          <button class="btn btn-outline-primary" onclick="listProducts()">
            List all
          </button>
        </div>
      </div>

      <div id="status" style="display: none"></div>

      <div class="mt-3 card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Id</th>
                  <th scope="col">Name</th>
                  <th scope="col">Price</th>
                  <th scope="col">Qty</th>
                  <th scope="col">Status</th>
                  <th scope="col">Category</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>

      <div class="text-muted mt-2" style="font-size: 0.9rem">
        API used:
        <code>/queries/inventory/products</code>
        and
        <code>/queries/inventory/products/{id}</code>
      </div>
    </div>
  </body>
</html>
