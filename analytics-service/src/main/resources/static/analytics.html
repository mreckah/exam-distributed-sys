<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Order Analytics</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <style>
      body {
        background: #fafafa;
      }
      #chartWrap {
        height: 420px;
      }
    </style>

    <script>
      let chart = null;
      let pollTimer = null;

      function apiBase() {
        // If this page is served via gateway at /analytics-service/analytics.html,
        // calls must be prefixed with /analytics-service.
        const p = window.location.pathname || "";
        if (p.startsWith("/analytics-service/")) {
          return "/analytics-service";
        }
        return "";
      }

      function setStatus(message, isError) {
        const el = document.getElementById("status");
        if (!el) return;
        el.textContent = message || "";
        el.className = isError
          ? "alert alert-danger mt-2 mb-0"
          : "alert alert-info mt-2 mb-0";
        el.style.display = message ? "block" : "none";
      }

      function ensureChart() {
        if (chart) return;

        const ctx = document.getElementById("myChart");
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: [],
            datasets: [
              {
                label: "Order Count",
                data: [],
                borderColor: "rgba(54, 162, 235, 1)",
                backgroundColor: "rgba(54, 162, 235, 0.15)",
                borderWidth: 2,
                tension: 0.15,
                fill: true,
                yAxisID: "yCount",
              },
              {
                label: "Total Amount",
                data: [],
                borderColor: "rgba(255, 99, 132, 1)",
                backgroundColor: "rgba(255, 99, 132, 0.15)",
                borderWidth: 2,
                tension: 0.15,
                fill: true,
                yAxisID: "yAmount",
              },
            ],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: {
              mode: "index",
              intersect: false,
            },
            scales: {
              x: {
                grid: { display: false },
              },
              yCount: {
                type: "linear",
                position: "left",
                beginAtZero: true,
                ticks: { precision: 0 },
                grid: { color: "rgba(0, 0, 0, 0.05)" },
              },
              yAmount: {
                type: "linear",
                position: "right",
                beginAtZero: true,
                grid: { drawOnChartArea: false },
              },
            },
            plugins: {
              legend: {
                position: "top",
              },
            },
          },
        });
      }

      function toTimeLabel(isoString) {
        const d = new Date(isoString);
        if (isNaN(d.getTime())) return String(isoString);
        return d.toLocaleTimeString();
      }

      function upsertPoint(tsIso, count, totalAmount) {
        ensureChart();

        const labels = chart.data.labels;
        const countData = chart.data.datasets[0].data;
        const amountData = chart.data.datasets[1].data;

        const label = toTimeLabel(tsIso);

        const existingIndex = labels.indexOf(label);
        if (existingIndex >= 0) {
          countData[existingIndex] = count;
          amountData[existingIndex] = totalAmount;
        } else {
          labels.push(label);
          countData.push(count);
          amountData.push(totalAmount);
        }

        const maxPoints = 30;
        while (labels.length > maxPoints) {
          labels.shift();
          countData.shift();
          amountData.shift();
        }

        chart.update();
      }

      async function fetchAnalyticsOnce() {
        const res = await fetch(`${apiBase()}/analytics/orders`, { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        // data format: { "2025-...Z": { count: 1, totalAmount: 10.0 }, ... }
        const keys = Object.keys(data || {}).sort();
        if (keys.length === 0) {
          setStatus("No analytics yet. Generate events to see data.", false);
          return;
        }

        keys.forEach((k) => {
          const v = data[k] || {};
          const count = Number(v.count ?? 0);
          const totalAmount = Number(v.totalAmount ?? 0);
          upsertPoint(k, isNaN(count) ? 0 : count, isNaN(totalAmount) ? 0 : totalAmount);
        });

        setStatus(`Loaded ${keys.length} window(s). Auto-refreshing...`, false);
      }

      async function startPolling() {
        if (typeof Chart === "undefined") {
          setStatus("Chart.js failed to load. Refresh the page.", true);
          return;
        }

        ensureChart();

        if (pollTimer) clearInterval(pollTimer);

        const doPoll = async () => {
          try {
            await fetchAnalyticsOnce();
          } catch (e) {
            setStatus(`Failed to fetch analytics: ${e.message}`, true);
          }
        };

        await doPoll();
        pollTimer = setInterval(doPoll, 1000);
      }

      async function generateTestEvent() {
        try {
          setStatus("Publishing test event...", false);
          const res = await fetch(`${apiBase()}/analytics/test/orders`, { method: "POST" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const id = await res.text();
          setStatus(`Published OrderEvent id=${id}.`, false);
        } catch (e) {
          setStatus(`Failed to publish test event: ${e.message}`, true);
        }
      }

      window.addEventListener("load", () => {
        startPolling();
      });
    </script>
  </head>

  <body>
    <div class="container py-3">
      <div class="row align-items-center">
        <div class="col">
          <h3 class="mb-0">Order Analytics</h3>
          <small class="text-muted">Auto-refreshing view of /analytics/orders</small>
        </div>
        <div class="col-auto">
          <button class="btn btn-primary" onclick="generateTestEvent()">
            Generate test event
          </button>
        </div>
      </div>

      <div id="status" style="display: none"></div>

      <div id="chartWrap" class="mt-3">
        <canvas id="myChart"></canvas>
      </div>
    </div>
  </body>
</html>
