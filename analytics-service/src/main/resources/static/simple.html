<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Analytics (Simple)</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />

    <script>
      function apiBase() {
        const p = window.location.pathname || "";
        if (p.startsWith("/analytics-service/")) return "/analytics-service";
        return "";
      }

      function setStatus(message, isError) {
        const el = document.getElementById("status");
        if (!el) return;
        el.textContent = message || "";
        el.className = isError
          ? "alert alert-danger mt-2 mb-0"
          : "alert alert-info mt-2 mb-0";
        el.style.display = message ? "block" : "none";
      }

      function clearTable() {
        const tbody = document.getElementById("rows");
        tbody.innerHTML = "";
      }

      function addRow(ts, count, total) {
        const tbody = document.getElementById("rows");
        const tr = document.createElement("tr");

        const tdTs = document.createElement("td");
        const tdCount = document.createElement("td");
        const tdTotal = document.createElement("td");

        tdTs.textContent = ts;
        tdCount.textContent = String(count);
        tdTotal.textContent = String(total);

        tr.appendChild(tdTs);
        tr.appendChild(tdCount);
        tr.appendChild(tdTotal);
        tbody.appendChild(tr);
      }

      async function refresh() {
        try {
          const res = await fetch(`${apiBase()}/analytics/orders`, {
            cache: "no-store",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const data = await res.json();

          clearTable();
          const keys = Object.keys(data || {}).sort();
          if (keys.length === 0) {
            setStatus("No analytics yet. Click 'Generate test event'.", false);
            return;
          }

          keys.forEach((k) => {
            const v = data[k] || {};
            addRow(k, v.count ?? 0, v.totalAmount ?? 0);
          });

          setStatus(`Loaded ${keys.length} window(s).`, false);
        } catch (e) {
          setStatus(`Failed to load analytics: ${e.message}`, true);
        }
      }

      async function generate() {
        try {
          setStatus("Publishing test event...", false);
          const res = await fetch(`${apiBase()}/analytics/test/orders`, {
            method: "POST",
          });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const id = await res.text();
          setStatus(`Published event id=${id}. Refreshing...`, false);
          await new Promise((r) => setTimeout(r, 1200));
          await refresh();
        } catch (e) {
          setStatus(`Failed to publish test event: ${e.message}`, true);
        }
      }

      window.addEventListener("load", () => {
        refresh();
        setInterval(refresh, 2000);
      });
    </script>
  </head>

  <body>
    <div class="container py-3">
      <div class="d-flex align-items-center justify-content-between">
        <div>
          <h4 class="mb-0">Analytics (Simple)</h4>
          <small class="text-muted">Shows data from /analytics/orders</small>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary" onclick="refresh()">
            Refresh
          </button>
          <button class="btn btn-primary" onclick="generate()">
            Generate test event
          </button>
        </div>
      </div>

      <div id="status" style="display: none"></div>

      <div class="mt-3 card">
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-sm align-middle mb-0">
              <thead>
                <tr>
                  <th scope="col">Window timestamp</th>
                  <th scope="col">Count</th>
                  <th scope="col">Total amount</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
